name: IT early-news RSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - run_ithome.py
      - .github/workflows/ithome_rss.yml
  schedule:
    # Beijing time (UTC+8): daily at 09:00 and 22:00.
    - cron: '0 1,14 * * *'

permissions:
  contents: write

concurrency:
  group: ithome-rss-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate IT early-news RSS
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (!(Test-Path $chrome)) { throw "Preinstalled Chrome was not found at $chrome" }
          python run_ithome.py --max 20 --headless --chrome "$chrome"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit generated feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f feeds/feed_ithome_account_10233.xml cache/ithome_account_10233.json
          if ! git diff --cached --quiet; then
            git commit -m "Update IT early-news RSS [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh RSS CDN cache
        continue-on-error: true
        shell: bash
        run: curl --fail --max-time 30 --retry 2 "https://purge.jsdelivr.net/gh/hspthinking/ForgeRSS@main/feeds/feed_ithome_account_10233.xml"
